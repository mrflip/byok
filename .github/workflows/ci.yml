name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels that pull request's run still in progress: only the latest
# commit's result matters there. Pushes to main each get a group of their own, by run id, so every
# commit to main keeps its result.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Within a job every check runs whatever an earlier one found, so one failure never hides another,
# and the job fails if any did. `lint-typecheck` and `test-build` are the two the main ruleset
# requires. Each step is a root script: the root's own check, then every workspace package's
# (`pnpm -r`), so a package added under packages/ or demos/ is covered with no edit here.
jobs:
  # Lint first, as the likelier of the two to fail for a reason worth reading, then typecheck, then
  # keep a pull request's history semi-linear (PROCESS.md): its branch may hold no merge commit;
  # last, a pull request's changeset.
  lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck
      - name: Reject merge commits in the branch
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merges=$(git rev-list --merges "$BASE_SHA..$HEAD_SHA")
          if [ -n "$merges" ]; then
            echo "::error::Branch contains merge commits. Rebase instead: git fetch origin && git rebase origin/main"
            git log --oneline --no-walk $merges
            exit 1
          fi
      # A pull request that changes a public package carries a changeset saying what its release
      # would say; one that needs no release carries an empty one (PROCESS.md, Releases). Dependabot
      # cannot write one, and the Version PR is where changesets are used up, so neither is asked.
      - name: Require a changeset
        if: >-
          ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request'
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && !startsWith(github.head_ref, 'changeset-release/') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm changeset status --since="$BASE_SHA"

  # The unit tests with coverage, then the build. Under CI a build fails on any warning, and checks
  # each package as a consumer would see it (publint, arethetypeswrong: each tsdown.config.ts).
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

  # The unit tests on the other Node majors a consumer may run, beside the one we develop on.
  # Not required by the ruleset: a failure here is news, not a gate.
  node-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
