name: CodeQL

# GitHub's static analysis for security problems, over the package's code and over these
# workflows themselves (the release workflow holds the right to publish). Findings appear on the
# Security tab, and on a pull request that introduces one. This file replaces CodeQL's "default
# setup": leave that switched off in the repository's settings, or the two will collide.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
