name: Release

# Publishing a GitHub release whose tag is `v<package.json's version>` stages that version on npm.
# It becomes public only when a maintainer approves it with 2FA, on npmjs.com or with
# `npm stage approve <stage-id>`; this workflow cannot approve its own staging. npm's trusted
# publishing authenticates this workflow by OIDC: there is no npm token in the repository's
# secrets, the trusted publisher is configured to allow `npm stage publish` and not `npm publish`,
# and npm attaches a provenance statement naming this repository and run.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag names the package's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json's version, $version"
            exit 1
          fi
      # The npm bundled with the pinned Node (11.19.0 with Node 24.21.0) predates the 11.21.0 that
      # `npm dist-tag` over OIDC needs; npm 12.2.0 is the current release and supports Node 24.
      - name: Install the pinned npm
        run: npm install --global npm@12.2.0
      # A prerelease version (`1.2.0-beta.1`) goes out under the `next` dist-tag, so that a plain
      # `npm install safebyok` never picks it up. `prepublishOnly` runs `pnpm justify` first.
      - name: Stage for approval
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) disttag=next ;;
            *)   disttag=latest ;;
          esac
          npm stage publish --access public --tag "$disttag"
